<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>PokerNow Hand Alert - Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <h1>PokerNow Hand Alert — 상세 설정</h1>
    <p class="hint">
      아래 13×13 표에서 알림을 받을 스타팅 핸드를 클릭해 선택/해제하세요.<br />
      대각선 = 페어(AA, KK…), 대각선 위 = 수딧(s), 대각선 아래 = 오프수딧(o).
    </p>

    <div class="toolbar">
      <button id="selectPremium">프리미엄 기본값</button>
      <button id="selectAll">전체 선택</button>
      <button id="clearAll">전체 해제</button>
      <span id="count" class="count"></span>
    </div>

    <div class="matrix-scroll">
      <table id="matrix" class="matrix"><!-- JS 로 채움 --></table>
    </div>

    <div class="legend">
      <span class="chip pair">페어</span>
      <span class="chip suited">수딧 (s)</span>
      <span class="chip offsuit">오프수딧 (o)</span>
      <span class="chip selected">선택됨</span>
    </div>

    <div class="gto-opts">
      <h2>GTO 자동 액션</h2>
      <label class="opt"><input type="checkbox" id="gtoMode" /> GTO 모드 사용 (프리미엄 목록 대신 GTO 차트)</label>
      <label class="opt"><input type="checkbox" id="gtoStreetAll" /> 포스트플롭도 자동 (에퀴티 근사)</label>
      <label class="opt"><input type="checkbox" id="gtoAggroAuto" /> 레이즈도 자동으로 실행</label>
      <p class="hint">자동 폴드와 별개로 동작합니다. 레이즈를 자동으로 두면 GTO 사이즈(오픈 2.5BB ·
        3벳 ×3 등)를 금액칸에 넣고 확인까지 눌러줍니다. 인원수에 맞춘 100BB 근사 차트이며
        gto.js 의 레인지 문자열·사이즈 규칙으로 조정할 수 있습니다.</p>
    </div>

    <div class="save-row">
      <button id="saveBtn" class="save-btn">저장</button>
      <span id="savedMsg" class="saved-msg"></span>
    </div>
  </div>

  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
